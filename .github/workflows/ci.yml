name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m firmware_config_compiler examples/weather_node.json --out build/generated
      - run: cc -std=c11 -Wall -Wextra -Werror -pedantic -I build/generated build/generated/firmware_config.c examples/config_smoke.c -o build/config-smoke
      - run: ./build/config-smoke
